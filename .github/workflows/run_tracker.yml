name: Hourly Stock Analyzer

on:
  schedule:
    # திங்கள் முதல் வெள்ளி வரை, இந்திய நேரப்படி காலை 9:30 முதல் மாலை 3:30 வரை ஒவ்வொரு மணிநேரமும் இயங்கும்
    - cron: '30 4-10 * * 1-5'
  workflow_dispatch:

jobs:
  run-analysis:
    runs-config:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Tracker Script
      run: |
        python -c "import analyzer; print('Hourly Tracking Completed!')"

